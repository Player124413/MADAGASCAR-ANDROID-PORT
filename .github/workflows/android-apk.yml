name: Android APK

on:
  push:
    paths:
      - "android/**"
      - "kit/exemplos/madagascar/src/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - "kit/exemplos/madagascar/src/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
    inputs:
      build_mode:
        description: "stub validates the public toolchain; real downloads an authorized private image"
        type: choice
        required: true
        default: stub
        options:
          - stub
          - real
      iso_url:
        description: "Real mode only: direct HTTPS URL or Google Drive share URL for your authorized Xbox image. Visible to users who can view this run; leave blank to use secret MADAGASCAR_ISO_URL."
        type: string
        required: false
      upload_real_apk:
        description: "Upload the real APK as a one-day private CI artifact (only enable in a private, access-controlled repository)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  # This always-safe build carries no game-derived files. It validates Gradle, NDK, CMake, SDL and APK packaging
  # on every Android-related change.
  apk-stub:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_mode == 'stub' }}
    name: Build and inspect ARM64 stub APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Test XDVDFS extraction with a synthetic image
        shell: bash
        run: python3 android/tools/extract_xdvdfs.py --self-test

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Locate the hosted Android SDK command-line tools
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$sdk_root"
          for bin in "$sdk_root/cmdline-tools/latest/bin" "$sdk_root/cmdline-tools/bin" "$sdk_root/tools/bin"; do
            if test -x "$bin/sdkmanager"; then
              echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
              echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
              echo "$bin" >> "$GITHUB_PATH"
              echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
              exit 0
            fi
          done
          echo "sdkmanager was not found below $sdk_root" >&2
          find "$sdk_root" -maxdepth 4 -name sdkmanager -type f -print >&2 || true
          exit 1

      - name: Install pinned Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.31.6"

      - name: Assemble debug APK with game-free native stub
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleDebug -PandroidStub

      - name: Verify APK contents and ABI
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -Z1 "$apk" | tee apk-contents.txt
          grep -qx 'lib/arm64-v8a/libmain.so' apk-contents.txt
          grep -qx 'lib/arm64-v8a/libSDL3.so' apk-contents.txt
          ! unzip -Z1 "$apk" | grep -Eqi '\.(xbe|iso|xiso)$'

      - name: Upload installable smoke-test APK
        uses: actions/upload-artifact@v5
        with:
          name: madagascar-android-stub-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  # A real build is deliberately manual. Its URL comes from the per-run iso_url input or the MADAGASCAR_ISO_URL
  # secret, never from repository YAML/source. The secret option avoids exposing a stable private URL in run metadata.
  apk-real:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_mode == 'real' }}
    name: Build ARM64 APK from authorized private image
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      # Prefer the explicit manual-run value so a different authorized image can be used per run. A secret keeps
      # a stable private URL out of run metadata; it is used when iso_url is intentionally left blank.
      MADAGASCAR_ISO_URL: ${{ inputs.iso_url || secrets.MADAGASCAR_ISO_URL }}
      MADAGASCAR_ISO_SHA256: ${{ secrets.MADAGASCAR_ISO_SHA256 }}
      # These four secrets make every production build update-compatible with the preceding one.
      MADAGASCAR_KEYSTORE_BASE64: ${{ secrets.MADAGASCAR_KEYSTORE_BASE64 }}
      MADAGASCAR_KEYSTORE_PASSWORD: ${{ secrets.MADAGASCAR_KEYSTORE_PASSWORD }}
      MADAGASCAR_KEY_ALIAS: ${{ secrets.MADAGASCAR_KEY_ALIAS }}
      MADAGASCAR_KEY_PASSWORD: ${{ secrets.MADAGASCAR_KEY_PASSWORD }}
      EXPECTED_XBE_SHA256: 5a21c1357e652971199c11bc7bb00ac1a9acf7a23d6b1ad321528e9d60b6444c

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Restore the stable release signing key
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            'MADAGASCAR_KEYSTORE_BASE64',
            'MADAGASCAR_KEYSTORE_PASSWORD',
            'MADAGASCAR_KEY_ALIAS',
            'MADAGASCAR_KEY_PASSWORD'
          )
          $missing = $required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing) {
            throw "Set these Actions secrets before producing an installable real APK: $($missing -join ', '). A temporary debug signature cannot update an existing installation."
          }
          try {
            $keyBytes = [Convert]::FromBase64String($env:MADAGASCAR_KEYSTORE_BASE64)
          } catch {
            throw 'MADAGASCAR_KEYSTORE_BASE64 is not valid Base64.'
          }
          $keyPath = Join-Path $env:RUNNER_TEMP 'madagascar-release.jks'
          [System.IO.File]::WriteAllBytes($keyPath, $keyBytes)
          if (!(Test-Path $keyPath) -or (Get-Item $keyPath).Length -eq 0) {
            throw 'The decoded release keystore is empty.'
          }
          "MADAGASCAR_KEYSTORE=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set a monotonically increasing APK version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Android's versionCode is a signed 32-bit integer. This stays unique for a workflow rerun as well as a
          # new dispatch, while remaining comfortably below the Play/package-manager limit.
          $run = [int64]$env:GITHUB_RUN_NUMBER
          $attempt = [int64]$env:GITHUB_RUN_ATTEMPT
          $code = $run * 100 + $attempt
          if ($code -le 1 -or $code -gt 2100000000) { throw "Calculated invalid Android versionCode: $code" }
          "MADAGASCAR_VERSION_CODE=$code" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MADAGASCAR_VERSION_NAME=0.1.0-ci.$run.$attempt" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download the private ISO without printing its URL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:MADAGASCAR_ISO_URL)) {
            throw 'Enter iso_url for this manual run or set the MADAGASCAR_ISO_URL Actions secret before selecting real mode.'
          }
          if ($env:MADAGASCAR_ISO_URL -notmatch '^https://') {
            throw 'The image URL must use HTTPS.'
          }
          $iso = Join-Path $env:RUNNER_TEMP 'madagascar.iso'
          if ($env:MADAGASCAR_ISO_URL -match '^https://(drive|docs)\.google\.com/') {
            # gdown handles Google's confirmation-token page for large Drive files. The URL remains only in the
            # process environment and is never interpolated into a command that is echoed by the shell.
            python -m pip install --disable-pip-version-check --no-cache-dir 'gdown==5.2.0'
            python -m gdown --quiet --fuzzy --output $iso $env:MADAGASCAR_ISO_URL
          } else {
            curl.exe --fail --location --retry 3 --retry-delay 2 --output $iso $env:MADAGASCAR_ISO_URL
          }
          if (!(Test-Path $iso) -or (Get-Item $iso).Length -lt 1MB) {
            throw 'The download is missing or implausibly small. Use a direct binary-download URL or a Google Drive file-sharing URL.'
          }
          "MADAGASCAR_ISO_PATH=$iso" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify optional image checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (![string]::IsNullOrWhiteSpace($env:MADAGASCAR_ISO_SHA256)) {
            $actual = (Get-FileHash -LiteralPath $env:MADAGASCAR_ISO_PATH -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $env:MADAGASCAR_ISO_SHA256.ToLowerInvariant()) {
              throw 'The downloaded ISO does not match MADAGASCAR_ISO_SHA256.'
            }
          }

      - name: Extract and verify the expected USA default.xbe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:GITHUB_WORKSPACE 'kit\exemplos\madagascar\assets\default.xbe'
          python android\tools\extract_xdvdfs.py `
            --input $env:MADAGASCAR_ISO_PATH `
            --output $output `
            --expected-sha256 $env:EXPECTED_XBE_SHA256

      - name: Locate Visual Studio with clang-cl
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (!(Test-Path $vswhere)) { throw 'vswhere.exe was not found on the Windows runner.' }
          $vsdir = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Llvm.Clang -property installationPath
          if ([string]::IsNullOrWhiteSpace($vsdir) -or !(Test-Path (Join-Path $vsdir 'VC\Tools\Llvm\x64\bin\clang-cl.exe'))) {
            throw 'A Visual Studio installation with the C++ Clang tools is required for xbe_recomp.'
          }
          "MADAGASCAR_VS_DIR=$vsdir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Recompile the verified XBE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File "$env:GITHUB_WORKSPACE\kit\ferramentas\recompilar.ps1" `
            -Jogo "$env:GITHUB_WORKSPACE\kit\exemplos\madagascar" `
            -VsDir $env:MADAGASCAR_VS_DIR
          if ($LASTEXITCODE -ne 0) { throw "xbe_recomp failed with exit code $LASTEXITCODE." }

      - name: Locate Android SDK command-line tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @($env:ANDROID_HOME, $env:ANDROID_SDK_ROOT, "$env:LOCALAPPDATA\Android\Sdk") |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_) -and (Test-Path $_) }
          $sdkRoot = $candidates | Select-Object -First 1
          if (!$sdkRoot) { throw 'Android SDK was not found on the Windows runner.' }
          $sdkManager = Get-ChildItem -LiteralPath $sdkRoot -Filter sdkmanager.bat -Recurse -File |
            Select-Object -First 1 -ExpandProperty FullName
          if (!$sdkManager) { throw "sdkmanager.bat was not found under $sdkRoot." }
          "ANDROID_HOME=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_SDK_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MADAGASCAR_SDKMANAGER=$sdkManager" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install pinned Android SDK components
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $answers = 1..100 | ForEach-Object { 'y' }
          $answers | & $env:MADAGASCAR_SDKMANAGER "--sdk_root=$env:ANDROID_HOME" --licenses
          & $env:MADAGASCAR_SDKMANAGER "--sdk_root=$env:ANDROID_HOME" `
            'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' `
            'ndk;28.2.13676358' 'cmake;3.31.6'
          if ($LASTEXITCODE -ne 0) { throw "sdkmanager failed with exit code $LASTEXITCODE." }

      - name: Assemble release APK
        working-directory: android
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\gradlew.bat --no-daemon --stacktrace :app:assembleRelease `
            -PrequireReleaseSigning `
            "-PversionCode=$env:MADAGASCAR_VERSION_CODE" `
            "-PversionName=$env:MADAGASCAR_VERSION_NAME"
          if ($LASTEXITCODE -ne 0) { throw "Gradle failed with exit code $LASTEXITCODE." }

      - name: Verify real APK contents and ABI
        working-directory: android
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $apk = 'app\build\outputs\apk\release\app-release.apk'
          if (!(Test-Path $apk) -or (Get-Item $apk).Length -le 0) { throw 'Release APK was not produced.' }
          $entries = & jar tf $apk
          if ($entries -notcontains 'lib/arm64-v8a/libmain.so' -or $entries -notcontains 'lib/arm64-v8a/libSDL3.so') {
            throw 'The release APK is missing an expected ARM64 native library.'
          }
          if ($entries | Select-String -Pattern '\.(xbe|iso|xiso)$' -CaseSensitive:$false) {
            throw 'Game-image files must not be packaged into the APK.'
          }
          $buildTools = Get-ChildItem -LiteralPath (Join-Path $env:ANDROID_HOME 'build-tools') -Directory |
            Sort-Object Name -Descending | Select-Object -First 1
          if (!$buildTools) { throw 'Android build-tools were not found for APK verification.' }
          $aapt = Join-Path $buildTools.FullName 'aapt.exe'
          $apksigner = Join-Path $buildTools.FullName 'apksigner.bat'
          $badging = (& $aapt dump badging $apk) -join "`n"
          if ($badging -notmatch "versionCode='$env:MADAGASCAR_VERSION_CODE'") {
            throw "The APK did not receive expected versionCode $env:MADAGASCAR_VERSION_CODE."
          }
          & $apksigner verify --verbose $apk
          if ($LASTEXITCODE -ne 0) { throw "apksigner verification failed with exit code $LASTEXITCODE." }

      - name: Upload real APK only when explicitly requested
        if: ${{ inputs.upload_real_apk }}
        uses: actions/upload-artifact@v5
        with:
          name: madagascar-android-release-apk-private
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 1

      - name: Remove private inputs from the runner
        if: ${{ always() }}
        shell: pwsh
        run: |
          if ($env:MADAGASCAR_ISO_PATH) {
            Remove-Item -LiteralPath $env:MADAGASCAR_ISO_PATH -Force -ErrorAction SilentlyContinue
          }
          Remove-Item -LiteralPath 'kit\exemplos\madagascar\assets\default.xbe' -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath 'kit\exemplos\madagascar\generated' -Recurse -Force -ErrorAction SilentlyContinue
          if ($env:MADAGASCAR_KEYSTORE) {
            Remove-Item -LiteralPath $env:MADAGASCAR_KEYSTORE -Force -ErrorAction SilentlyContinue
          }
