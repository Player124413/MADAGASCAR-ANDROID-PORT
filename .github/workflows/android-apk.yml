name: Android APK

on:
  push:
    paths:
      - "android/**"
      - "kit/exemplos/madagascar/src/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - "kit/exemplos/madagascar/src/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

# The repository deliberately excludes the XBE and generated recompiler output. This workflow therefore builds a
# packaging-only native stub. It validates the reproducible Android toolchain path but never publishes game code/data.
permissions:
  contents: read

jobs:
  apk-stub:
    name: Build and inspect ARM64 stub APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Locate the hosted Android SDK command-line tools
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$sdk_root"
          for bin in "$sdk_root/cmdline-tools/latest/bin" "$sdk_root/cmdline-tools/bin" "$sdk_root/tools/bin"; do
            if test -x "$bin/sdkmanager"; then
              echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
              echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
              echo "$bin" >> "$GITHUB_PATH"
              echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
              exit 0
            fi
          done
          echo "sdkmanager was not found below $sdk_root" >&2
          find "$sdk_root" -maxdepth 4 -name sdkmanager -type f -print >&2 || true
          exit 1

      - name: Install pinned Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.31.6"

      - name: Assemble debug APK with game-free native stub
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleDebug -PandroidStub

      - name: Verify APK contents and ABI
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -Z1 "$apk" | tee apk-contents.txt
          grep -qx 'lib/arm64-v8a/libmain.so' apk-contents.txt
          grep -qx 'lib/arm64-v8a/libSDL3.so' apk-contents.txt
          ! unzip -Z1 "$apk" | grep -Eqi '\.(xbe|iso|xiso)$'

      - name: Upload installable smoke-test APK
        uses: actions/upload-artifact@v4
        with:
          name: madagascar-android-stub-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
