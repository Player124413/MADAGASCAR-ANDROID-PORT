plugins {
    id "com.android.application"
}

// SDL3 is shared by the native Vulkan host and its Java Activity. Pin the C and Java sides together.
def sdlDir = file("../third_party/SDL")
def sdlTag = "release-3.4.16"
tasks.register("fetchSDL") {
    onlyIf { !new File(sdlDir, "CMakeLists.txt").exists() }
    doLast {
        sdlDir.parentFile.mkdirs()
        exec {
            commandLine "git", "clone", "--depth", "1", "--branch", sdlTag,
                        "https://github.com/libsdl-org/SDL.git", sdlDir.absolutePath
        }
    }
}
preBuild.dependsOn("fetchSDL")

android {
    namespace "com.player124413.madagascar"
    compileSdk 34
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "com.player124413.madagascar"
        minSdk 29
        targetSdk 34
        versionCode project.hasProperty("versionCode") ? project.versionCode.toInteger() : 1
        versionName project.hasProperty("versionName") ? project.versionName : "0.1.0-dev"
        ndk { abiFilters "arm64-v8a" }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
                // Used only by the CI smoke test. A stub builds libmain.so but contains no game or recompiled code.
                if (project.hasProperty("androidStub")) {
                    arguments "-DMADAGASCAR_ANDROID_STUB=ON"
                }
                if (project.hasProperty("xbeGenerated")) {
                    arguments "-DXBE_GENERATED=${project.xbeGenerated}"
                }
                if (project.hasProperty("xbeImage")) {
                    arguments "-DXBE_IMAGE=${project.xbeImage}"
                }
            }
        }
    }

    // CI/release builders provide this stable key through the environment, never through source control.
    // APK updates are accepted by Android only when the package name *and the signing certificate* stay unchanged.
    def keystorePath = System.getenv("MADAGASCAR_KEYSTORE")
    def requireReleaseSigning = project.hasProperty("requireReleaseSigning")
    if (requireReleaseSigning && !keystorePath) {
        throw new GradleException("A stable MADAGASCAR_KEYSTORE is required for this release build.")
    }
    signingConfigs {
        if (keystorePath) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv("MADAGASCAR_KEYSTORE_PASSWORD")
                keyAlias System.getenv("MADAGASCAR_KEY_ALIAS")
                keyPassword System.getenv("MADAGASCAR_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            // The recompiled x86 game must be optimized even in an installable debug APK.
            externalNativeBuild {
                cmake { arguments "-DCMAKE_BUILD_TYPE=Release" }
            }
        }
        release {
            minifyEnabled false
            // Local validation may use Gradle's debug key. The CI workflow passes -PrequireReleaseSigning and
            // refuses that fallback, because an ephemeral debug key cannot support future in-place updates.
            signingConfig keystorePath ? signingConfigs.release : signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path "../CMakeLists.txt"
            version "3.31.6"
        }
    }

    sourceSets {
        main {
            java.srcDirs += new File(sdlDir, "android-project/app/src/main/java")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}
